services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    # networks: # Assign to custom network
    #   - my-app-network

  mongo:
    image: mongo:6
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  # Admin interfaces
  # pgadmin:
  #   image: dpage/pgadmin4
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
  #   ports:
  #     - "8080:80"
  #   depends_on:
  #     - postgres

  # mongo-express:
  #   image: mongo-express
  #   restart: always
  #   environment:
  #     ME_CONFIG_MONGODB_SERVER: mongo
  #     ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME}
  #     ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD}
  #   ports:
  #     - "8081:8081"
  #   depends_on:
  #     - mongo

  user-service:
    build: ./packages/user-service
    ports:
      - "4000:4000"
    env_file:
      - ./packages/user-service/.env
    depends_on:
      - postgres

  freelance-service:
    build: ./packages/freelance-service
    ports:
      - "4001:4001"
    environment:
      USER_SERVICE_URL: http://user-service:4000/auth/validate
    depends_on:
      - postgres
      - user-service

  event-service:
    build: ./packages/event-service
    ports:
      - "4002:4002"
    environment:
      USER_SERVICE_URL: http://user-service:4000/auth/validate
    depends_on:
      - postgres
      - user-service

  frontend:
    build: ./packages/frontend
    ports:
      - "3000:3000"
    environment:
      USER_SERVICE_URL: http://user-service:4000/auth/validate
    depends_on:
      - postgres
      - user-service
      - freelance-service
      - event-service

