services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    # networks: # Assign to custom network
    #   - my-app-network

  user-service:
    build: ./packages/user-service
    ports:
      - "4000:4000"
    env_file:
      - ./packages/user-service/.env
    depends_on:
      - postgres

  freelance-service:
    build: ./packages/freelance-service
    ports:
      - "4001:4001"
    environment:
      USER_SERVICE_URL: http://user-service:4000/auth/validate
    depends_on:
      - postgres
      - user-service

  event-service:
    build: ./packages/event-service
    ports:
      - "4002:4002"
    environment:
      USER_SERVICE_URL: http://user-service:4000/auth/validate
    depends_on:
      - postgres
      - user-service

  frontend:
    build: ./packages/frontend
    ports:
      - "3000:3000"
    environment:
      USER_SERVICE_URL: http://user-service:4000/auth/validate
    depends_on:
      - postgres
      - user-service
      - freelance-service
      - event-service

  # chat-service:
