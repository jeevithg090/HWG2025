# Runs the whole platform: Postgres, the three APIs and the web app.
#   cp .env.example .env   # then edit the secrets
#   docker compose up --build

x-backend: &backend
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment: &backend-env
    NODE_ENV: production
    DB_HOST: postgres
    DB_PORT: 5432
    DB_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER in .env}
    DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    DB_DATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    DB_SYNCHRONIZE: "true"
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-service:
    <<: *backend
    build: ./packages/user-service
    ports:
      - "4000:4000"
    environment:
      <<: *backend-env
      PORT: 4000
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}

  freelance-service:
    <<: *backend
    build: ./packages/freelance-service
    ports:
      - "4001:4001"
    environment:
      <<: *backend-env
      PORT: 4001

  event-service:
    <<: *backend
    build: ./packages/event-service
    ports:
      - "4002:4002"
    environment:
      <<: *backend-env
      PORT: 4002

  frontend:
    build:
      context: ./packages/frontend
      args:
        NEXT_PUBLIC_USER_SERVICE_URL: ${NEXT_PUBLIC_USER_SERVICE_URL:-http://localhost:4000}
        NEXT_PUBLIC_FREELANCE_SERVICE_URL: ${NEXT_PUBLIC_FREELANCE_SERVICE_URL:-http://localhost:4001}
        NEXT_PUBLIC_EVENT_SERVICE_URL: ${NEXT_PUBLIC_EVENT_SERVICE_URL:-http://localhost:4002}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - user-service
      - freelance-service
      - event-service

volumes:
  pgdata:
