version: '3.8'

services:
  event-service:
    build: 
      context: ./packages/event-service
    ports:
      - "4002:4002"
    volumes:
      - ./packages/event-service:/app
      - /app/node_modules
    environment:
      - PORT=4002
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_DATABASE=eventservice
    depends_on:
      - postgres
      
  # Make sure this service exists in your main docker-compose.yml
  postgres:
    # Your postgres configuration here
    # This is just a reminder, not meant to be included if postgres is already configured
    volumes:
      - postgres_data:/var/lib/postgresql/data
